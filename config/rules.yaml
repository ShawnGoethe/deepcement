# 固井质量评估规则配置
# 基于石油行业标准 SY/T 5374-2019

# 水泥胶结质量评估规则
cement_bond:
  # AC 声波时差阈值 (μs/ft)
  # 水泥胶结越好，声波时差越低
  ac_thresholds:
    excellent:
      max: 90
      score: 95
      desc: "胶结优良，水泥环完整"
    good:
      max: 100
      score: 80
      desc: "胶结良好，基本合格"
    qualified:
      max: 120
      score: 65
      desc: "胶结合格，存在轻微问题"
    poor:
      max: 999
      score: 40
      desc: "胶结差或自由套管"

  # 声波时差异常判定
  ac_anomaly:
    # AC 值突变阈值（相邻点差值）
    spike_threshold: 30
    # 连续低值段最小长度（点数）
    low_segment_min_length: 10

# 井径规则
caliper_rules:
  # 标准钻头直径 (in)
  bit_diameter: 8.5

  # 扩径判定
  washout:
    threshold: 1.2      # 井径/钻头直径 > 1.2 判定为扩径
    score_penalty: 15    # 扩径扣分
    desc: "井眼扩径，可能影响水泥环质量"

  # 缩径判定
  tight_hole:
    threshold: 0.9      # 井径/钻头直径 < 0.9 判定为缩径
    score_penalty: 10    # 缩径扣分
    desc: "井眼缩径，可能造成卡钻风险"

  # 井径变化率
  cal_change_rate:
    max: 0.5            # 最大允许变化率 (in/100ft)
    score_penalty: 5

# 电阻率规则
resistivity_rules:
  # RT 地层电阻率阈值 (Ω·m)
  rt_thresholds:
    gas_zone:
      min: 50
      desc: "含气层特征"
    oil_zone:
      min: 20
      max: 50
      desc: "含油层特征"
    water_zone:
      max: 20
      desc: "含水层特征"

  # 气侵判定
  gas_invasion:
    # 套管鞋附近 RT 异常高值
    casing_shoe_depth: 500  # 套管鞋深度 (m)
    rt_threshold: 100
    desc: "可能存在气侵"

# 自然伽马规则
gamma_ray_rules:
  # GR 值范围 (API)
  shale_threshold: 80     # 泥岩判定阈值
  sand_threshold: 30      # 砂岩判定阈值

  # 水泥返高判定
  cement_top:
    # GR 突变点可能指示水泥返高
    gr_change_threshold: 20
    desc: "GR 突变可能指示水泥面位置"

# 综合评分权重
scoring_weights:
  ac_score: 0.35          # 声波时差权重
  cal_score: 0.20         # 井径权重
  rt_score: 0.20          # 电阻率权重
  gr_score: 0.15          # 自然伽马权重
  overall_quality: 0.10   # 综合质量权重

# 置信度阈值（用于分层评估）
confidence_thresholds:
  rule_engine: 0.85       # 规则引擎置信度阈值
  xgboost: 0.75           # XGBoost 置信度阈值
  llm: 0.0                # LLM 总是返回结果

# 质量等级定义
quality_grades:
  excellent:
    min_score: 90
    label: "优秀"
    desc: "固井质量优良，各项指标均达标"
  good:
    min_score: 75
    label: "良好"
    desc: "固井质量良好，基本满足要求"
  qualified:
    min_score: 60
    label: "合格"
    desc: "固井质量合格，存在轻微问题"
  poor:
    min_score: 0
    label: "不合格"
    desc: "固井质量不合格，需要采取补救措施"

# 异常情况判定规则
anomaly_rules:
  # 漏失判定
  lost_circulation:
    cal_increase_threshold: 1.5   # 井径突然增大系数
    rt_decrease_threshold: 0.5    # 电阻率突然降低系数
    desc: "可能存在漏失"

  # 窜槽判定
  channeling:
    ac_variability_threshold: 20  # AC 值波动阈值
    desc: "可能存在窜槽"

  # 套管居中度
  casing_centralization:
    cal_asymmetry_threshold: 0.3  # 井径不对称阈值
    desc: "套管可能不居中"
