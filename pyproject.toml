[project]
name = "deepcement"
version = "0.1.0"
description = "固井质量评测报告系统"
requires-python = ">=3.9"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["core", "agent", "config"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # 行长度由 black 处理
